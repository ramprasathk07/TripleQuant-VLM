method: awq
backend: modelopt

model:
  model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  model_type: llm
  modality: text

scheme:
  scheme: W4A16
  group_size: 128
  symmetric: true
  observer: percentile
  per_channel: false
  targets: ["Linear"]
  ignore:
    - lm_head

calibration:
  dataset_name: HuggingFaceH4/ultrachat_200k
  split: train_sft
  num_samples: 256
  max_seq_len: 1024
  seed: 42

output:
  output_dir: ./tinyllama-1b-awq-modelopt
  save_compressed: true
  save_processor: true

smoothquant:
  enabled: false

awq:
  duo_scaling: true