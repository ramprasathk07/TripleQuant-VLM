# config_vlm_nanollava.yaml
method: awq                      # 'awq' algorithm works well for VLMs
backend: llm_compressor

model:
  model_id: qnguyen3/nanoLLaVA-1.5 # A small, efficient 1B VLM
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false        # Generally safe to set false for these models
  model_type: vlm                 # Crucial: Signals it's a VLM to the loader
  modality: vision_text
  # min_pixels: 256               # Optional: Resize small images up
  # max_pixels: 1280              # Optional: Resize large images down

scheme:
  scheme: W8A8                    # 8-bit for both weights and activations (balanced)
  # scheme: W4A16                 # More aggressive 4-bit, may lose quality
  group_size: 128
  symmetric: true
  actorder: true                  # Helps AWQ precision
  observer: mse
  per_channel: false
  targets: ["Linear"]
  ignore:
    - lm_head                     # Standard to ignore the language modeling head
    # --- CRITICAL: Exclude all parts of the vision tower ---
    - re:.*vision_model.*
    - re:.*visual.*
    - re:.*vit.*
    - re:.*mm_projector.*
    - re:.*multi_modal_projector.*
    - re:.*merger.*
    # --- END OF VISION TOWER EXCLUSION ---

calibration:
  # Dataset with images AND text
  dataset_name: HuggingFaceM4/TextOCR
  split: train                    # Adjust split name based on dataset
  num_samples: 256                # Smaller sample set, as image processing is heavy
  max_seq_len: 1024               # Reasonable sequence length for image+text
  image_field: image              # The column containing images
  text_field: text                # The column containing text
  seed: 42

output:
  output_dir: ./nanollava-1.5-awq-w8a8-llmcompressor
  save_compressed: true
  save_processor: true

smoothquant:
  enabled: false                  # SmoothQuant is for W8A8 activation smoothing

awq:
  duo_scaling: true               # Recommended for AWQ