# tencent/HunyuanOCR (1B OCR VLM) Â· AWQ Â· INT4 (W4A16) Â· llm_compressor
# NOTE: HunyuanOCR uses a custom arch (HunYuanVLForConditionalGeneration).
#   - needs trust_remote_code: true
#   - needs a recent transformers (the model card pins a specific commit)
#   - its processor wants use_fast=False; if AutoProcessor fails, that is the cause.
method: awq
backend: llm_compressor

model:
  model_id: tencent/HunyuanOCR
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: true
  model_type: vlm
  modality: vision_text

scheme:
  scheme: W4A16
  group_size: 128
  symmetric: true
  per_channel: false
  observer: mse
  targets: ["Linear"]
  ignore: ["lm_head"]

calibration:
  dataset_name: linxy/LaTeX_OCR
  subset: full              # required: LaTeX_OCR is multi-config; 'full' has train/val/test
  dataset_format: image_text
  split: train
  image_field: image
  text_field: text             # real column is 'text', not 'formula'
  instruction_prompt: "Read the text in the image."
  num_samples: 64
  max_seq_len: 2048
  seed: 42

output:
  output_dir: ./outputs/hunyuan-ocr/awq-w4a16
  save_compressed: true
  save_processor: true

awq:
  duo_scaling: true
