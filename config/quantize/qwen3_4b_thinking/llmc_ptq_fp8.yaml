# Qwen3-4B-Thinking · PTQ · FP8 static (E4M3, per-tensor) · llm_compressor
method: ptq
backend: llm_compressor

model:
  model_id: Qwen/Qwen3-4B-Thinking-2507
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  model_type: llm
  modality: text

scheme:
  scheme: FP8
  targets: ["Linear"]
  ignore: ["lm_head"]

calibration:
  dataset_name: HuggingFaceH4/ultrachat_200k
  split: train_sft
  num_samples: 128
  max_seq_len: 2048
  seed: 42

output:
  output_dir: ./outputs/qwen3-4b-thinking/ptq-fp8
  save_compressed: true
  save_processor: true
