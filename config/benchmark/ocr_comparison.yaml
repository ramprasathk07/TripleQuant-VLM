# TripleQuant-VLM benchmark config — example.
# Compares a base VLM against its quantized variant on OCR + perf + memory.
# Run: python benchmark.py -c config/benchmark/ocr_comparison.yaml

run_name: ocr_comparison
output_root: ./results

# Run each model on these runtimes. HF = full metrics (logits + VLM OCR);
# vLLM = perf/throughput + mmlu only.
runtimes: ["hf"]

models:
  - name: qwen2.5-vl-3b-base
    path: Qwen/Qwen2.5-VL-3B-Instruct
    model_type: vlm
    is_local: false
    dtype: bfloat16
    trust_remote_code: true
    max_model_len: 4096

  - name: qwen2.5-vl-3b-w4a16
    path: ./outputs/qwen2.5vl-gptq-w4a16-llmcompressor/Qwen2.5-VL-3B-Instruct-llm_compressor-gptq-W4A16
    model_type: vlm
    is_local: true
    is_compressed: true
    vllm_quantization: compressed-tensors
    dtype: bfloat16
    trust_remote_code: true
    max_model_len: 4096

# Optional baseline for delta metrics (logit_kl / token_agree). Leave unset to skip.
# baseline:
#   name: qwen2.5-vl-3b-base
#   path: Qwen/Qwen2.5-VL-3B-Instruct
#   model_type: vlm

metrics:
  quality_llm: []                      # VLMs: skip text PPL/MMLU here
  quality_ocr: ["cer", "wer", "exact_match", "bleu"]
  perf:        ["ttft", "tpot", "throughput"]
  memory:      ["disk", "vram", "load_time"]

datasets:
  ocr_dataset: linxy/LaTeX_OCR
  ocr_num_samples: 100
  ocr_max_new_tokens: 256

latency:
  batch_sizes: [1, 4, 8]
  output_lens: [128]
  num_requests: 50
  warmup_requests: 5

tracking:
  enabled: []                          # add ["wandb","mlflow"] once trackers wired

seed: 42
