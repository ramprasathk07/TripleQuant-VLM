# Qwen2.5-VL-3B-Instruct Â· AWQ Â· INT4 (W4A16) Â· llm_compressor
# Vision tower auto-excluded from quantization by BaseQuantizer.
method: awq
backend: llm_compressor

model:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  model_type: vlm
  modality: vision_text
  max_pixels: 1003520         # cap image tokens to bound calibration memory

scheme:
  scheme: W4A16
  group_size: 128
  symmetric: true
  per_channel: false
  observer: mse
  targets: ["Linear"]
  ignore: ["lm_head"]

calibration:
  dataset_name: linxy/LaTeX_OCR
  subset: full              # required: LaTeX_OCR is multi-config; 'full' has train/val/test
  dataset_format: image_text
  split: train
  image_field: image
  text_field: text             # real column is 'text', not 'formula'
  instruction_prompt: "Convert the image to a LaTeX formula."
  num_samples: 64
  max_seq_len: 2048
  seed: 42

output:
  output_dir: ./outputs/qwen2.5-vl-3b/awq-w4a16
  save_compressed: true
  save_processor: true

awq:
  duo_scaling: true
