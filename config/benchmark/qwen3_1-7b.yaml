# Benchmark: Qwen3-1.7B — FP16 baseline vs a TurboQuant-KV-cache variant.
# Demonstrates the new per-model knobs:
#   model_class : which transformers Auto* class to load with (auto|causal_lm|
#                 image_text_to_text|seq2seq_lm|vision2seq).
#   turboquant  : enable the TurboQuant KV cache (HF runtime, single-sequence).
run_name: qwen3-1.7b-sweep
output_root: ./results
runtimes: ["hf"]    # add "vllm" once a vLLM env is available

metrics:
  # quality_llm: ["ppl", "mmlu_tiny", "gsm8k", "ceval", "aime", "humaneval"]
  quality_llm: ["ppl", "mmlu_tiny"]
  quality_ocr: []
  perf:        ["ttft", "tpot", "throughput", "max_context", "ctx_sweep", "tq_bits_sweep"]
  memory:      ["disk", "vram", "load_time"]

tracking:
  enabled: ["wandb", "tensorboard"]   # per-model W&B runs + local TensorBoard
  wandb_project: triplequant-bench
  # set WANDB_API_KEY (or `wandb login`) to activate W&B; otherwise auto-skipped.
  # TensorBoard logs to results/<run_name>/tensorboard/  (tensorboard --logdir there)

datasets:
  ppl_dataset: wikitext          # NOTE: ppl is HF-only (vLLM hides logits) → auto-skipped on vllm
  ppl_subset:  wikitext-2-raw-v1
  gsm8k_num_samples: 200
  gsm8k_max_new_tokens: 2048     # Qwen3-Thinking: long <think> chains; 512 truncates before the answer
  aime_num_samples: 30
  aime_max_new_tokens: 4096      # competition math reasoning is long
  ceval_num_q_per_subject: 20
  humaneval_num_samples: 20
  humaneval_max_new_tokens: 1536 # leave room for reasoning before the code
  humaneval_execute: false       # set true ONLY in a trusted/sandboxed env (runs model-generated code)

latency:
  batch_sizes:  [1, 4, 8]
  output_lens:  [128, 512, 1024, 4096]
  num_requests: 20
  warmup_requests: 3
  # Context lengths for the KV-memory sweep (must exceed ring_capacity=256 to show
  # TurboQuant compression). The sweep stops at the first OOM.
  ctx_sweep: [512, 1024, 2048, 4096, 8192, 16384]

models:
  - name: qwen3-1.7b-fp16-baseline
    path: Qwen/Qwen3-1.7B
    is_local: false
    model_type: llm
    model_class: causal_lm        # explicit; "auto" would also pick causal_lm
    dtype: bfloat16

  - name: qwen3-1.7b-turboquant-k3v2
    path: Qwen/Qwen3-1.7B
    is_local: false
    model_type: llm
    model_class: causal_lm
    dtype: bfloat16
    turboquant:
      enabled: true
      ring_capacity: 256
      key_bits: 3
      value_bits: 2
      use_qjl: false              # MSE-only keys (QJL hurts reconstruction)
      use_compressed_store: true  # TQ actually in the decode loop

