# Qwen2.5-VL-3B-Instruct Â· GPTQ Â· INT8 (W8A8) Â· llm_compressor
method: gptq
backend: llm_compressor

model:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  model_type: vlm
  modality: vision_text
  max_pixels: 1003520

scheme:
  scheme: W8A8
  symmetric: true
  per_channel: false
  observer: mse
  targets: ["Linear"]
  ignore: ["lm_head"]

calibration:
  dataset_name: linxy/LaTeX_OCR
  subset: full              # required: LaTeX_OCR is multi-config; 'full' has train/val/test
  dataset_format: image_text
  split: train
  image_field: image
  text_field: text             # real column is 'text', not 'formula'
  instruction_prompt: "Convert the image to a LaTeX formula."
  num_samples: 64
  max_seq_len: 2048
  seed: 42

output:
  output_dir: ./outputs/qwen2.5-vl-3b/gptq-w8a8
  save_compressed: true
  save_processor: true

gptq:
  dampening_frac: 0.01
  block_size: 128
