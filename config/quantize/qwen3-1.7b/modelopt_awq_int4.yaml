# Qwen3-1.7B · ModelOpt · INT4 AWQ (modelopt backend)
# Works on any CUDA GPU (RTX 2060 Super included)
method: awq
backend: modelopt

model:
  model_id: Qwen/Qwen3-1.7B
  torch_dtype: bfloat16
  device_map: auto
  trust_remote_code: false
  model_type: llm
  modality: text

scheme:
  scheme: FP8_DYNAMIC
  group_size: 128
  targets: ["Linear"]
  ignore: ["lm_head"]

calibration:
  dataset_name: HuggingFaceH4/ultrachat_200k
  split: train_sft
  num_samples: 128
  max_seq_len: 2048
  seed: 42

output:
  output_dir: ./outputs/qwen3-1-7b/modelopt-int4-awq
  save_compressed: true
  save_processor: true