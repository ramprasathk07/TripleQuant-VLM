# TripleQuant-VLM benchmark config — text LLM.
# Compares base TinyLlama vs its quantized variant on quality + perf + memory.
# Run: python benchmark.py -c config/benchmark/llm_comparison.yaml

run_name: llm_comparison
output_root: ./results

# HF needed for ppl/logit_kl (raw logits). Add "vllm" to also profile
# throughput on the production runtime (vLLM skips ppl automatically).
runtimes: ["hf"]

models:
  - name: tinyllama-1b-base
    path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    model_type: llm
    is_local: false
    dtype: bfloat16
    device_map: auto
    max_model_len: 2048

  - name: tinyllama-1b-awq-w4a16
    path: ./tinyllama-1b-awq-modelopt/TinyLlama-1.1B-Chat-v1.0-modelopt-awq-W4A16
    model_type: llm
    is_local: true
    is_compressed: true
    vllm_quantization: compressed-tensors
    dtype: bfloat16
    device_map: auto
    max_model_len: 2048

# Optional: enables logit_kl + token_agree (delta vs baseline). Leave unset to skip.
# baseline:
#   name: tinyllama-1b-base
#   path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
#   model_type: llm

metrics:
  quality_llm: ["ppl", "mmlu_tiny"]      # logit_kl/token_agree need baseline (stubbed)
  quality_ocr: []                        # text-only model
  perf:        ["ttft", "tpot", "throughput"]
  memory:      ["disk", "vram", "load_time"]

datasets:
  ppl_dataset: wikitext
  ppl_subset:  wikitext-2-raw-v1
  mmlu_subjects: ["high_school_mathematics", "computer_science", "philosophy"]

latency:
  batch_sizes: [1, 4, 8, 16]
  output_lens: [128]
  num_requests: 50
  warmup_requests: 5

tracking:
  enabled: []                            # add ["wandb","mlflow"] once trackers wired

seed: 42
